  dataset_dir: /home/aqsa/Final_Dataset
  data_fields: ['image', 'gt_bbox', 'gt_class', 'gt_morphology', 'is_crowd']
TestDataset:
  name: ImageFolder
  anno_path: annotations_shape/val_combined_shape.json
  dataset_dir: /home/aqsa/Final_Dataset

